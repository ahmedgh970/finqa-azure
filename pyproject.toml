[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-rag"
version = "0.1.0"
description = "Diagnostics et outils Python pour un corpus financier sur Azure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.24,<2",
    "azure-mgmt-resource-subscriptions>=1,<4",
    "azure-ai-projects>=2,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
    "azure-storage-blob>=12.31.0",
    "pypdf[crypto]>=6.20,<7",
    "azure-search-documents>=12.0.0",
    "openai>=3.24,<4",
    "opentelemetry-sdk>=1.30,<2",
    "azure-ai-evaluation>=1.18,<2",
]

[project.scripts]
ai103 = "ai103.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
